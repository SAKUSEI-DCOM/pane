let gifts=DEFAULT_GIFTS.slice();
function normalizeCatalog(raw){
 const list=Array.isArray(raw)?raw:Array.isArray(raw.gifts)?raw.gifts:Array.isArray(raw.items)?raw.items:Array.isArray(raw.catalog)?raw.catalog:Object.entries(raw).map(([key,value])=>typeof value==='object'&&value?{id:key,...value}:null).filter(Boolean);
 return list.map((g,i)=>{if(typeof g==='string')return {name:g,cost:0,image:''};
 const name=String(g.name??g.title??g.label??g.giftName??g.id??`ギフト${i+1}`);
 const image=g.image??g.imageUrl??g.image_url??g.img??g.src??g.file??g.filename??g.path??'';
 return {name,cost:Number(g.cost??g.price??g.points??g.point??0)||0,image:typeof image==='string'?image:''};
 }).filter(g=>g.name);
}

let mode='mix',panels=[],opened=new Set(),seed=0;
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const area=p=>Math.abs(p.reduce((s,v,i)=>{let w=p[(i+1)%p.length];return s+v[0]*w[1]-w[0]*v[1]},0)/2);
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const centroid=p=>{let x=0,y=0;for(let v of p){x+=v[0];y+=v[1]}return [x/p.length,y/p.length]};
const poly=(...v)=>v;
const splitPolygon=(p)=>{let n=p.length;if(n===3){let k=Math.floor(rand(0,3)),a=p[k],b=p[(k+1)%3],c=p[(k+2)%3],q=lerp(a,b,rand(.3,.7));return [[a,q,c],[q,b,c]]}let i=Math.floor(rand(0,n)),j=(i+2)%n; if(n===4){let q=lerp(p[i],p[(i+1)%n],rand(.3,.7)),r=lerp(p[(i+2)%n],p[(i+3)%n],rand(.3,.7));return [[q,p[(i+1)%n],p[(i+2)%n],r],[r,p[(i+3)%n],p[i],q]]}let a=p[i],b=p[j],left=[],right=[],k=i;while(k!==j){left.push(p[k]);k=(k+1)%n}left.push(b);k=j;while(k!==i){right.push(p[k]);k=(k+1)%n}right.push(a);return [left,right]};
function triangulate(p){if(p.length===3)return[p];let out=[];for(let i=1;i<p.length-1;i++)out.push([p[0],p[i],p[i+1]]);return out}
function generateTriangleRandom(){// 全領域を三角形で初期分割し、各三角形を辺上の点で再分割。隙間・重なりなし。
 let pieces=[[ [0,0],[100,0],[100,100] ],[[0,0],[100,100],[0,100]]];let target=rand(20,37);while(pieces.length<target){let eligible=pieces.map((p,i)=>({p,i,a:area(p)})).filter(x=>x.a>85);if(!eligible.length)break;eligible.sort((a,b)=>b.a-a.a);let chosen=pick(eligible.slice(0,Math.min(6,eligible.length)));pieces.splice(chosen.i,1,...splitPolygon(chosen.p))}return pieces}
function generateMix(){// 外周をランダムな扇形風の領域に分け、中央の円を重ねて隙間なく覆う。
 const cx=50,cy=50,angles=[];let n=Math.floor(rand(5,9));for(let i=0;i<n;i++)angles.push((i+rand(-.18,.18))*2*Math.PI/n);angles.sort((a,b)=>a-b);
 // 正方形の外周に向かう光線の交点。隣接点間の外周を全て辿るため欠けが出ない。
 const borderPoint=a=>{let dx=Math.cos(a),dy=Math.sin(a),t=Math.min(dx>0?50/dx:dx<0?-50/dx:Infinity,dy>0?50/dy:dy<0?-50/dy:Infinity);return [cx+t*dx,cy+t*dy]};
 const perimeter=p=>{let [x,y]=p;if(Math.abs(y)<1e-7)return x;if(Math.abs(x-100)<1e-7)return 100+y;if(Math.abs(y-100)<1e-7)return 300-x;return 400-y};
 let rays=angles.map(a=>borderPoint(a));let ordered=rays.map((p,i)=>({p,i,t:perimeter(p)})).sort((a,b)=>a.t-b.t);
 let result=[];for(let i=0;i<ordered.length;i++){let a=ordered[i],b=ordered[(i+1)%ordered.length],pts=[[50,50],a.p];let t=a.t,limit=b.t+(b.t<=t?400:0);for(let k=Math.floor(t/100)+1;k*100<limit-1e-7;k++){let u=(k*100)%400;pts.push(u===0?[0,0]:u===100?[100,0]:u===200?[100,100]:[0,100])}pts.push(b.p);result.push(pts)}
 result.push({kind:'circle',cx:50,cy:50,r:25});return result;
}
function generateSquare(){// 外周を少し大きい長方形パネルで囲い、内側を正方形で埋める。
 const N=6,edge=16,step=(100-2*edge)/4,p=[];let cuts=[0,edge,edge+step,edge+step*2,edge+step*3,100-edge,100];
 // 上下の帯: 幅広長方形を4枚ずつ
 for(let j of [0,5])for(let i=0;i<4;i++){let x=i*25;p.push(poly([x,cuts[j]],[x+25,cuts[j]],[x+25,cuts[j+1]],[x,cuts[j+1]]))}
 // 左右の帯: 縦長の大きめ長方形を4枚ずつ
 for(let j=1;j<=4;j++)for(let i of [0,5])p.push(poly([cuts[i],cuts[j]],[cuts[i+1],cuts[j]],[cuts[i+1],cuts[j+1]],[cuts[i],cuts[j+1]]));
 // 中央: 4×4の正方形
 for(let j=1;j<=4;j++)for(let i=1;i<=4;i++)p.push(poly([cuts[i],cuts[j]],[cuts[i+1],cuts[j]],[cuts[i+1],cuts[j+1]],[cuts[i],cuts[j+1]]));return p}
function generateOldTriangle(){let p=[];let N=5;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let a=[x*20,y*20],b=[(x+1)*20,y*20],c=[(x+1)*20,(y+1)*20],d=[x*20,(y+1)*20];p.push([a,b,c],[a,c,d])}return p}
const colors=['#f479c4','#e66ab8','#fd8ccc','#eb6eb9','#f98ac9','#dc5eaa','#f37ab9','#f18fcf'];
function create(){opened.clear();let shapes=mode==='mix'?generateMix():mode==='triRandom'?generateTriangleRandom():mode==='square'?generateSquare():generateOldTriangle();panels=shapes.map((points,i)=>({id:i,points,gift:gifts[Math.floor(Math.random()*gifts.length)],color:pick(colors)}));render()}
function svgEl(tag,attrs={}){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function render(){let svg=svgEl('svg',{viewBox:'0 0 100 100',preserveAspectRatio:'none',role:'img','aria-label':'パネル開け盤面'});for(let p of panels){let circle=p.points.kind==='circle',openedNow=opened.has(p.id);let attrs=circle?{cx:p.points.cx,cy:p.points.cy,r:p.points.r}:{points:p.points.map(v=>v.join(',')).join(' ')};let shape=svgEl(circle?'circle':'polygon',{...attrs,fill:openedNow?'#fff':p.color,stroke:'#19121b','stroke-width':'.32','stroke-linejoin':'round',class:'panel'+(openedNow?' open':'')});shape.addEventListener('click',()=>{opened.add(p.id);render();let d=document.getElementById('giftDialog');document.getElementById('giftTitle').textContent=p.gift.name;let im=document.getElementById('giftImage');im.src=p.gift.image||'';im.style.display=p.gift.image?'block':'none';document.getElementById('giftPrice').textContent=p.gift.cost?'🟡 '+p.gift.cost+'ポイント':'';d.showModal()});svg.appendChild(shape);let c=circle?[50,50]:centroid(p.points),a=circle?Math.PI*625:area(p.points),label=svgEl('text',{x:c[0],y:c[1],class:'panel-label'+(openedNow?' open':''),'font-size':circle?7:Math.max(1.8,Math.min(4.5,Math.sqrt(a)*.43))});label.textContent=openedNow?p.gift.name:String(p.id+1);svg.appendChild(label)}document.getElementById('board').replaceChildren(svg);document.getElementById('status').textContent=`${{mix:'ランダムミックス',tri:'従来の三角形',triRandom:'ランダム三角形',square:'正方形＋外周長方形'}[mode]}｜${opened.size} / ${panels.length} パネル開封`;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;create()}));document.getElementById('reset').onclick=create;document.getElementById('openAll').onclick=()=>{panels.forEach(p=>opened.add(p.id));render()};renderGifts();loadCatalog();
</script></body></html>
